---
  - name : CREATE LOOPBACK INTERFACE
    hosts: csr
    gather_facts: False
    connection: network_cli
    become: yes
    become_method: enable
    tasks:
      - name: Creating loopback
        ios_interface:
          name: Loopback123
          enabled: True
          description: Loopback interface created with Ansible
      - name: Assign IP to loopback
        ios_l3_interface:
          name: Loopback123
          ipv4: 10.1.2.3/32