---
- name: CONFIGURE LOGIN BANNER
  hosts: csr
  gather_facts: no
  connection: local
  become: yes
  become_method: enable

  tasks:
  - name: Update login banner
    ios_banner:
      banner: login
      text: |
        ----------------------------------------
        |
        | Unauthorized access is prohibited 
        |
        ----------------------------------------
        |
        | You are logged into {{ inventory_hostname }}
        | 
        ----------------------------------------
      state: present